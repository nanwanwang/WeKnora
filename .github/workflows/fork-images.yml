name: Fork Images
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      publish:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: app
            context: .
            dockerfile: docker/Dockerfile.app
          - component: ui
            context: ./frontend
            dockerfile: frontend/Dockerfile
          - component: docreader
            context: .
            dockerfile: docker/Dockerfile.docreader
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Resolve immutable image tag
        id: image
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Reclaim space on the disposable GitHub runner
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h /
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Log in to GHCR for reviewed main commits only
        if: inputs.publish && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ inputs.publish && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.image.outputs.owner }}/weknora-${{ matrix.component }}:sha-${{ steps.image.outputs.sha }}
          build-args: |
            WITH_ANYDOC=1
            COMMIT_ID_ARG=${{ steps.image.outputs.sha }}
            VITE_FRONTEND_COMMIT=${{ steps.image.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.sha }}
          cache-from: type=gha,scope=fork-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.component }}
