# Rendered by docker-entrypoint.sh when the MOM artifact source is enabled.
location ^~ /api/v1/mom-artifacts {
    limit_except GET { deny all; }
    proxy_pass ${MOM_ARTIFACTS_ORIGIN}/vbaseapi/aiApplications/weknora-artifacts;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-WeKnora-Login $http_authorization;
    proxy_set_header X-WeKnora-Workspace $http_x_tenant_id;
    proxy_set_header Authorization "";
    proxy_set_header X-API-Key "";
    proxy_set_header Cookie "";
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_cache off;
    proxy_buffering off;
}
